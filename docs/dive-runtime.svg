<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#383838"/></marker><marker id="ah-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#383838"/></marker></defs><rect width="1200" height="900" fill="#F4EFEA"/>
<text x="600.0" y="46" font-size="28" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="middle" fill="#383838">HOW THE DIVE WORKS</text>
<text x="600.0" y="72" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#383838">Two engines, one component · resizing the Duckling from the Dive · keeping the browser copy fresh</text>
<rect x="20" y="112" width="360" height="640" rx="14" fill="#ECE6DF"/>
<text x="42" y="100" font-size="16" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">YOUR BROWSER</text>
<rect x="420" y="112" width="380" height="640" rx="14" fill="#ECE6DF"/>
<text x="442" y="100" font-size="16" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">MOTHERDUCK</text>
<rect x="840" y="112" width="340" height="640" rx="14" fill="#ECE6DF"/>
<text x="862" y="100" font-size="16" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">AWS · us-east-1</text>
<rect x="36" y="140" width="320" height="596" rx="14" fill="#383838"/>
<rect x="44" y="132" width="320" height="596" rx="14" fill="#50C7B7" stroke="#383838" stroke-width="2"/>
<text x="60" y="160" font-size="18" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">DIVE</text>
<text x="60" y="182" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">app.motherduck.com · one React component</text>
<text x="60" y="201" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">useSQLQuery · useRunFlight · useFlightRun</text>
<rect x="60" y="226" width="288" height="112" rx="14" fill="#FFFFFF" stroke="#383838" stroke-width="2"/>
<text x="76" y="253" font-size="14" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">RIGHT RAIL</text>
<text x="76" y="276" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">engine toggle · duckling card</text>
<text x="76" y="295" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">what just ran: per-query latency,</text>
<text x="76" y="314" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">where it ran, the generated SQL</text>
<rect x="60" y="354" width="288" height="92" rx="14" fill="#FFFFFF" stroke="#383838" stroke-width="2"/>
<text x="76" y="381" font-size="14" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">CLOUD MODE</text>
<text x="76" y="404" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">every panel is one SQL round trip</text>
<text x="76" y="423" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">0.9-1.7 s per interaction</text>
<rect x="60" y="462" width="288" height="128" rx="14" fill="#FFFFFF" stroke="#383838" stroke-width="2"/>
<text x="76" y="489" font-size="14" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">BROWSER MODE · DUCKDB-WASM</text>
<text x="76" y="512" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">temp.main.daily_topics, top_stories</text>
<text x="76" y="531" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">84k rows, 10 chunks, dual execution</text>
<text x="76" y="550" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">same SQL runs in the tab</text>
<text x="76" y="569" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">80-155 ms per interaction</text>
<rect x="60" y="606" width="288" height="108" rx="14" fill="#FFFFFF" stroke="#383838" stroke-width="2" stroke-dasharray="8 6"/>
<text x="76" y="633" font-size="14" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">REFRESH (not built yet)</text>
<text x="76" y="656" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">every N min: cheap freshness query</text>
<text x="76" y="675" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">changed? CREATE OR REPLACE TEMP</text>
<text x="76" y="694" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">TABLE per chunk, panels follow</text>
<rect x="436" y="148" width="330" height="100" rx="14" fill="#383838"/>
<rect x="444" y="140" width="330" height="100" rx="14" fill="#97D4FF" stroke="#383838" stroke-width="2"/>
<text x="460" y="167" font-size="16" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">FLIGHT · duckling-resize</text>
<text x="460" y="190" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">config SIZE · F4 runner · ~5 s</text>
<text x="460" y="209" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">reads the config, sends it back</text>
<text x="460" y="228" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">with the new read_write size</text>
<rect x="436" y="284" width="330" height="84" rx="14" fill="#383838"/>
<rect x="444" y="276" width="330" height="84" rx="14" fill="#FFFFFF" stroke="#383838" stroke-width="2"/>
<text x="460" y="303" font-size="16" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">ADMIN REST API</text>
<text x="460" y="326" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">GET / PUT /v1/users/{user}/instances</text>
<text x="460" y="345" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">the Flight&#x27;s own token is enough</text>
<rect x="436" y="404" width="330" height="140" rx="14" fill="#383838"/>
<rect x="444" y="396" width="330" height="140" rx="14" fill="#6FC2FF" stroke="#383838" stroke-width="2"/>
<text x="460" y="423" font-size="16" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">DUCKLING · read_write</text>
<text x="460" y="446" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">Pulse · Standard · Jumbo · Mega · Giga</text>
<text x="460" y="465" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">runs the cloud SQL and the copy</text>
<text x="460" y="484" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">md_live_duckling_size() = live size</text>
<text x="460" y="503" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">new size on the next wake-up</text>
<rect x="436" y="592" width="330" height="144" rx="14" fill="#383838"/>
<rect x="444" y="584" width="330" height="144" rx="14" fill="#97D4FF" stroke="#383838" stroke-width="2"/>
<text x="460" y="611" font-size="16" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">FLIGHT · hn-lakehouse-transform</text>
<text x="460" y="634" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">on demand today; add a cron</text>
<text x="460" y="653" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">new titles through prompt_jev()</text>
<text x="460" y="672" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">rebuilds daily_topics, top_stories</text>
<text x="460" y="691" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">idempotent, safe to re-run</text>
<rect x="856" y="148" width="296" height="120" rx="14" fill="#383838"/>
<rect x="864" y="140" width="296" height="120" rx="14" fill="#FFFFFF" stroke="#383838" stroke-width="2"/>
<text x="880" y="167" font-size="16" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">NEW DATA · sql/05</text>
<text x="880" y="190" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">append from MotherDuck&#x27;s public</text>
<text x="880" y="209" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">hacker_news share to hn.items,</text>
<text x="880" y="228" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">500k ids per commit; re-run</text>
<rect x="856" y="404" width="296" height="332" rx="14" fill="#383838"/>
<rect x="864" y="396" width="296" height="332" rx="14" fill="#FFDE00" stroke="#383838" stroke-width="2"/>
<text x="880" y="423" font-size="16" font-family="Cousine, 'JetBrains Mono', Menlo, monospace" text-anchor="start" fill="#383838">S3 TABLES · ICEBERG</text>
<text x="880" y="446" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">bucket mure-lakehouse · ns hn</text>
<text x="880" y="465" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838"></text>
<text x="880" y="484" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">items · 50.5M</text>
<text x="880" y="503" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">stories · 4.8M</text>
<text x="880" y="522" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">stories_classified · 567k</text>
<text x="880" y="541" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">daily_topics · 65k</text>
<text x="880" y="560" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">top_stories · 19k</text>
<text x="880" y="579" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838"></text>
<text x="880" y="598" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">daily_topics + top_stories are</text>
<text x="880" y="617" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">the Dive&#x27;s serving tables</text>
