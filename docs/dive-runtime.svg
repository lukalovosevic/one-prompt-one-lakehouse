<path d="M1012,260 L1012,396" fill="none" stroke="#383838" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1016" y="321" width="51.2" height="17" fill="#ECE6DF"/>
<text x="1020" y="334" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">append</text>
<text x="22" y="792" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">(1) cloud: every interaction is SQL to the Duckling, which reads Iceberg.   (2) browser: dual execution copies the serving tables once: MotherDuck scans Iceberg, rows stream into DuckDB-Wasm.</text>
<text x="22" y="813" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">(3) resize: the Dive runs duckling-resize, which PUTs the size via the admin API; the Dive polls md_live_duckling_size() every 3 s until it matches.</text>
<text x="22" y="834" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">(4) refresh: a cron on the transform Flight updates Iceberg; the Dive checks max(month), count(*) and re-copies. Dashed = not built yet.</text>
<text x="22" y="855" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="start" fill="#383838">Dive sandbox (checked 17 Nov 2026): CREATE [OR REPLACE] TEMP TABLE runs; INSERT, DELETE and DROP are rejected, so a refresh replaces whole chunks.</text>
</svg>